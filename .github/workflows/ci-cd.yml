name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present -- --watchAll=false
        env:
          CI: true
      - run: npm run build

      # Works for both Vite (dist) and Create React App (build)
      - name: Detect build folder
        id: out
        run: |
          if [ -d dist ]; then echo "dir=dist" >> "$GITHUB_OUTPUT"
          else echo "dir=build" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
